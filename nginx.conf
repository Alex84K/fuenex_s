server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # index.html must always be revalidated so a deploy's new bundle
    # hashes are picked up immediately instead of being served stale.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed assets are immutable — cache them indefinitely.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri /index.html;
    }
}